services:
  mysql:
    image: mysql:8.4
    container_name: feedevent-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: feedevent
      MYSQL_USER: feedevent
      MYSQL_PASSWORD: feedevent
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
